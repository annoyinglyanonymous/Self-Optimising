<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Outreach</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="login-body">
  <main class="login-main">
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="login-brand">
        <span class="logo-dot"></span>
        <h1>Outreach</h1>
      </div>
      <h2 class="login-heading">Sign in</h2>

      <label class="login-field">
        <span>Email</span>
        <input id="login-email" type="email" required autocomplete="username" autofocus />
      </label>

      <label class="login-field">
        <span>Password</span>
        <input id="login-password" type="password" required autocomplete="current-password" />
      </label>

      <button type="submit" id="login-submit" class="btn-secondary">Sign in</button>
      <div id="login-error" class="login-error"></div>
    </form>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
