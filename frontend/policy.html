<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Policy · Outreach</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo-dot"></span>
      <h1>Outreach</h1>
    </div>
    <nav class="tabs">
      <a class="tab" href="/dashboard/overview">Overview</a>
      <a class="tab" href="/dashboard/leads">Leads</a>
      <a class="tab" href="/dashboard/approvals">Approvals</a>
      <a class="tab" href="/dashboard/policy">Policy</a>
      <a class="tab" href="/dashboard/activity">Activity</a>
      <a class="tab" href="/dashboard/settings">Settings</a>
    </nav>
    <div class="topbar-right">
      <button id="refresh-btn" class="btn-secondary">Refresh</button>
    </div>
  </header>

  <main>
    <section class="panel active">
      <div class="filters">
        <select id="policy-persona"><option value="">All personas</option></select>
        <select id="policy-channel">
          <option value="">All channels</option>
          <option value="email">email</option>
          <option value="linkedin">linkedin</option>
        </select>
      </div>
      <div class="card">
        <table class="data-table" id="policy-table">
          <thead>
            <tr>
              <th>Persona</th><th>Channel</th><th>Angle</th>
              <th>Trials</th><th>Successes</th>
              <th>Success rate</th><th>Posterior mean</th><th>Updated</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/static/shared.js"></script>
  <script src="/static/policy.js"></script>
</body>
</html>
